services:
  postgres:
    image: postgres:17-alpine
    container_name: tender-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tender_engine
      POSTGRES_USER: tender_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tender_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg17_tender_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_app -d tender_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg17_tender_data:
